id: toc-layout
name: TOC Layout
category: Navigation Patterns
purpose: >
  Long-form HTML document layout with a generated table of contents
  and section-based navigation.

rendering:
  output_type: html
  requires_document_metadata_header: true
  navigation: table-of-contents

required_sections:
  - Document Metadata
  - Table of Contents
  - Content

optional_sections:
  - Executive Summary
  - References
  - Appendix
  - Related Documents

structure:
  header:
    - Document Metadata Header
    - Title
    - Description

  body:
    - Table of Contents
    - Content Sections

  footer:
    - Last Updated
    - Generated By

usage:
  - Reports
  - Architecture Documents
  - Implementation Patterns
  - Coding Plans
  - Runbooks
  - Reference Documentation
